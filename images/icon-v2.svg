<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="55%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>

    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7bdff2"/>
      <stop offset="45%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>

    <linearGradient id="cubeShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a0ca3" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f0f23" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="spike" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="100%" stop-color="#c81d4e"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>

  <!-- linhas de grade sutis, dão profundidade tipo "chão" do jogo -->
  <g stroke="#2e3a59" stroke-width="1" opacity="0.5">
    <line x1="0" y1="50" x2="64" y2="50"/>
    <line x1="0" y1="56" x2="64" y2="56"/>
  </g>

  <!-- sombra de contato do cubo -->
  <ellipse cx="30" cy="49" rx="15" ry="3.5" fill="#000" opacity="0.35"/>

  <!-- espinho decorativo, atrás do cubo -->
  <polygon points="48,48 57,48 52.5,36" fill="url(#spike)" filter="url(#softShadow)"/>
  <polygon points="48,48 52.5,48 52.5,36" fill="#8e0e38" opacity="0.6"/>

  <!-- cubo do player, com face superior clara e lateral mais escura para efeito 3D -->
  <g transform="translate(28,28) rotate(-12)" filter="url(#softShadow)">
    <rect x="-15" y="-15" width="30" height="30" rx="5" fill="url(#cubeTop)"/>
    <!-- sombreado inferior direito para dar volume -->
    <rect x="-15" y="-15" width="30" height="30" rx="5" fill="url(#cubeShade)"/>
    <!-- highlight superior esquerdo -->
    <path d="M -15 -8 Q -15 -15 -8 -15 L 6 -15 Q -10 -6 -15 6 Z" fill="#ffffff" opacity="0.18"/>
    <!-- borda -->
    <rect x="-15" y="-15" width="30" height="30" rx="5" fill="none" stroke="#0f0f23" stroke-width="1.5" opacity="0.4"/>
    <!-- olhos -->
    <circle cx="-5" cy="-2" r="3.4" fill="#0f0f23"/>
    <circle cx="7" cy="-2" r="3.4" fill="#0f0f23"/>
    <circle cx="-4" cy="-3" r="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="8" cy="-3" r="1" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
